site_name: Chezmoi for Mere Mortals
site_description: Plain-language dotfiles management with chezmoi. One source state in a git repository applied to every machine you own, templates for the parts that differ between machines, an ignore list for the parts that stay home, and age encryption for the parts that are secret, all practised on a two-machine lab.
site_url: https://paulsullivan33-dev.github.io/chezmoi-for-mere-mortals/

# Guides live at the repo root (nice for GitHub browsing).
# The deploy workflow copies them into docs/ before building.
theme:
  name: material

